# 测试环境配置
# 主配置指向 PostgreSQL（见 AGENTS.md：application.properties 尚未补数据源），
# 为了让 @SpringBootTest 能在本地无数据库的情况下跑起来，测试用 H2 内存库替代。
spring.datasource.url=jdbc:h2:mem:webdesign;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
