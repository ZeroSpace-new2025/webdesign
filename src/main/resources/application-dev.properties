# ===== 本地开发环境：H2 内存数据库（PostgreSQL 兼容模式）=====
spring.datasource.url=jdbc:h2:mem:webdesign;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 每次启动重建表结构，由 DatabaseDataInitializer 写入权限、角色与演示账号
spring.jpa.hibernate.ddl-auto=create-drop

# 开发期明文输出 SQL，便于核对聚合与报表口径
spring.jpa.show-sql=true

# H2 控制台：访问 http://localhost:8080/h2-console 可直接查看数据库
# 注意：控制台路径已在 WebConfig 的认证白名单中放行，仅限本地开发使用
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
