# ===== 生产环境：PostgreSQL =====
# 通过环境变量注入连接信息，禁止把真实密码提交到仓库（AGENTS.md 第 6 节）。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webdesign}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# 表结构由 sql/schema.sql 建立，应用只做校验，不再由 Hibernate 改表：
#   * validate：启动时检查实体映射与库中表结构是否一致，不一致直接启动失败（尽早暴露问题）；
#   * 首次部署请先执行 sql/schema.sql（演示数据 sql/seed.sql），再启动应用；
#   * 没有执行建表脚本的临时环境，可临时改成 update 让 Hibernate 自动建表。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
