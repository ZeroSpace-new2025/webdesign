spring.application.name=webdesign

# === 运营与履约系统时间窗口 ===
# 订餐截止时间（HH:mm），之后允许聚合生成当日总括订单/生产单
fulfillment.order-deadline=09:00
# 配餐开始时间（HH:mm），之后开放配送单打印权限
fulfillment.delivery-start=11:30
server.port=8080

# 默认使用本地开发环境（H2，无需安装数据库）。
# 部署到 PostgreSQL 时改用：--spring.profiles.active=prod
spring.profiles.active=dev

# ===== JPA 通用配置 =====
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== 文件上传 =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== 菜品图片本地存储目录 =====
app.upload.dir=uploads
