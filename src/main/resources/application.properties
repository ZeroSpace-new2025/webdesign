# ===== 应用基础配置 =====
spring.application.name=webdesign
server.port=8080

# 默认使用本地开发环境（H2 内存库，无需安装数据库）。
# 部署到 PostgreSQL 时改用：--spring.profiles.active=prod
spring.profiles.active=dev

# ===== JPA 通用配置 =====
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 关闭 open-in-view：页面控制器一律在 service 事务内取完数据，避免延迟加载越界
spring.jpa.open-in-view=false

# ===== 文件上传 =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== 菜品图片存储（M1-06 图片上传服务）=====
# local：写本地磁盘（默认）。由 app.upload.dir 指定目录、/uploads/** 静态映射对外。
# oss  ：对象存储。接入时新增一个 service.menu.ImageStorage 的 OSS 实现并使其生效，
#        下列占位配置按所选云厂商的 SDK 读取（密钥一律走环境变量，不写进仓库）。
app.upload.mode=local
app.upload.dir=uploads
# app.upload.oss.endpoint=
# app.upload.oss.bucket=
# app.upload.oss.access-key-id=${OSS_ACCESS_KEY_ID:}
# app.upload.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}

# ===== 认证（JWT）=====
# 生产环境请通过环境变量覆盖密钥
app.jwt.secret=university-restaurant-ordering-demo-secret-2026
# token 有效期（分钟），默认 12 小时
app.jwt.expire-minutes=720

# ===== 时间窗口兜底默认值 =====
# 对应 demand.md：订餐截止时间默认 9:00，配餐开始时间默认 11:30。
# 运行期以 service_window 表的配置为准，这两项只在数据库无配置时回退使用。
app.service-window.default-cutoff-time=09:00
app.service-window.default-delivery-start-time=11:30

# ===== 定时任务 =====
# 订餐截止时间到达时聚合总括订单；配餐开始时间到达时预生成配送任务（cron 见 OperationScheduleConfig）
app.schedule.enabled=true

