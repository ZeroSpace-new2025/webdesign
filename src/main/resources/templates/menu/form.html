<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? '编辑菜单' : '新建菜单')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('menu')}"></nav>

<div class="container">
    <div class="page-header">
        <h1 th:text="${isEdit} ? '编辑菜单' : '新建菜单'">新建菜单</h1>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="card">
        <form th:action="@{/menus/save}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>菜单名称 <span class="req">*</span></label>
                <input type="text" class="form-control" th:field="*{name}"
                       placeholder="如：10月4日午餐菜单" required/>
            </div>

            <div class="form-group">
                <label>菜单描述</label>
                <textarea class="form-control" th:field="*{description}"></textarea>
            </div>

            <div class="form-group">
                <label>挑选菜品并定价</label>
                <div class="muted" style="margin-bottom:10px;">
                    勾选要加入菜单的菜品，可在右侧“菜单售价”中微调（默认取菜品标准价）。
                </div>
                <div class="recipe-picker">
                    <table>
                        <thead>
                        <tr>
                            <th style="width:46px;">选择</th>
                            <th>菜品名称</th>
                            <th>分类</th>
                            <th>单位</th>
                            <th style="width:120px;">菜单售价</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="row, stat : *{rows}"
                            th:classappend="${row.inactive} ? 'disabled-row'">
                            <td>
                                <input type="hidden"
                                       th:field="*{rows[__${stat.index}__].recipeId}"/>
                                <input type="checkbox"
                                       th:field="*{rows[__${stat.index}__].selected}"
                                       th:disabled="${row.inactive}"/>
                            </td>
                            <td>
                                <span th:text="${row.recipeName}">菜名</span>
                                <span class="muted" th:if="${row.inactive}">（已停用）</span>
                            </td>
                            <td th:text="${row.category}">分类</td>
                            <td th:text="${row.unit}">单位</td>
                            <td>
                                <input type="number" class="form-control price-input"
                                       th:field="*{rows[__${stat.index}__].price}"
                                       step="0.01" min="0"/>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存菜单</button>
                <a class="btn" th:href="@{/menus}">取消</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
