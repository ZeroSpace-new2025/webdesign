<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>登录 | 用户与报表中心</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-shell">
	<!-- 左侧品牌与当前模块信息 -->
	<section class="login-brand">
		<div>
			<div class="brand-lockup">
				<span class="brand-mark">餐</span>
				<div>
					<strong>企业餐厅网络点餐系统</strong>
					<span>用户与报表中心</span>
				</div>
			</div>
			<h1>集中管理人员、权限与财务数据</h1>
		</div>
		<div class="login-status-strip">
			<span><i data-lucide="users"></i>员工账号</span>
			<span><i data-lucide="shield-check"></i>角色权限</span>
			<span><i data-lucide="chart-no-axes-column"></i>财务报表</span>
		</div>
	</section>

	<!-- 右侧登录表单和演示账号 -->
	<section class="login-panel">
		<div class="login-form-wrap">
			<header>
				<p class="eyebrow">ACCOUNT ACCESS</p>
				<h2>登录控制台</h2>
			</header>
			<form id="login-form" class="form-stack" novalidate>
				<label class="field">
					<span>用户名</span>
					<div class="input-with-icon">
						<i data-lucide="user"></i>
						<input id="username" name="username" type="text" autocomplete="username"
							placeholder="请输入用户名" value="manager" required>
					</div>
				</label>
				<label class="field">
					<span>密码</span>
					<div class="input-with-icon">
						<i data-lucide="lock-keyhole"></i>
						<input id="password" name="password" type="password" autocomplete="current-password"
							placeholder="请输入密码" value="admin123" required>
					</div>
				</label>
				<p id="login-error" class="form-error" role="alert"></p>
				<button id="login-submit" class="button button-primary button-full" type="submit">
					<i data-lucide="log-in"></i>
					<span>登录</span>
				</button>
			</form>

			<div class="demo-accounts">
				<div class="section-mini-title">
					<span>演示账号</span>
					<span class="status-tag status-tag-neutral">内存模式</span>
				</div>
				<button class="account-option" type="button" data-username="manager" data-password="admin123">
					<span class="avatar avatar-manager">林</span>
					<span><strong>餐厅经理</strong><small>manager / admin123</small></span>
					<i data-lucide="arrow-right"></i>
				</button>
				<button class="account-option" type="button" data-username="finance" data-password="finance123">
					<span class="avatar avatar-finance">周</span>
					<span><strong>财务</strong><small>finance / finance123</small></span>
					<i data-lucide="arrow-right"></i>
				</button>
			</div>
		</div>
	</section>
</main>
<div id="toast-container" class="toast-container" aria-live="polite"></div>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
