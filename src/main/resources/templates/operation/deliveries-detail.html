<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>配送任务详情</title>
    <link rel="stylesheet" th:href="@{/css/operation.css}">
</head>
<body>
<div class="m3-container">
    <div class="m3-header">
        <h1>配送任务 · <span th:text="${task.taskNo}"></span></h1>
        <a th:href="@{/operation/deliveries}" class="m3-back">← 返回列表</a>
    </div>

    <div th:if="${message}" class="m3-alert m3-alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="m3-alert m3-alert-error" th:text="${error}"></div>

    <div class="m3-stats">
        <div class="m3-stat-card">
            <div class="m3-stat-label">员工</div>
            <div class="m3-stat-value" style="font-size:18px;" th:text="${task.employeeName}"></div>
        </div>
        <div class="m3-stat-card">
            <div class="m3-stat-label">工位</div>
            <div class="m3-stat-value" style="font-size:18px;" th:text="${task.workstation}"></div>
        </div>
        <div class="m3-stat-card">
            <div class="m3-stat-label">电话</div>
            <div class="m3-stat-value" style="font-size:18px;" th:text="${task.phone}"></div>
        </div>
        <div class="m3-stat-card m3-stat-success">
            <div class="m3-stat-label">状态</div>
            <div class="m3-stat-value" style="font-size:18px;" th:text="${task.statusText}"></div>
        </div>
    </div>

    <h2>配送明细</h2>
    <table class="m3-table">
        <thead><tr><th>菜名</th><th>分量</th><th>单位</th></tr></thead>
        <tbody>
        <tr th:each="item : ${task.items}">
            <td th:text="${item.recipeName}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${item.unit}"></td>
        </tr>
        </tbody>
    </table>

    <h2 style="margin-top:32px;">更新状态</h2>
    <form method="post" th:action="@{'/operation/deliveries/' + ${task.taskId} + '/status'}" class="m3-toolbar">
        <select name="status">
            <option th:each="s : ${allStatus}" th:value="${s.name()}" th:text="${s.text}"></option>
        </select>
        <input type="text" name="receiver" placeholder="签收人">
        <input type="text" name="remark" placeholder="备注">
        <button type="submit" class="m3-btn m3-btn-primary">提交</button>
    </form>
</div>
<script th:src="@{/js/operation.js}"></script>
</body>
</html>
