<!DOCTYPE html>
<!--
    配送任务详情页（M3 运营与履约）—— 查看单张配送单明细并登记配送状态。
    布局沿用菜品页：公共导航栏 + .container + .page-header + 卡片，样式只引用 /css/style.css。
-->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('配送任务详情')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('delivery')}"></nav>

<div class="container">
    <div class="page-header">
        <div>
            <h1>配送任务 · <span th:text="${task.taskNo}">DT-20260101-1</span></h1>
            <p class="muted" style="margin:4px 0 0;">
                就餐日期 <span th:text="${task.deliveryDate}">-</span>
                · 打印 <span th:text="${task.printCount}">0</span> 次
            </p>
        </div>
        <div class="page-actions">
            <a class="btn" th:href="@{/operation/deliveries}">返回列表</a>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="stat-grid">
        <div class="stat-card">
            <div class="stat-label">员工</div>
            <div class="stat-value" style="font-size:18px;" th:text="${task.employeeName}">员工</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">工位</div>
            <div class="stat-value" style="font-size:18px;" th:text="${task.workstation}">R-12</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">电话</div>
            <div class="stat-value" style="font-size:18px;" th:text="${task.phone}">13800000000</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">状态</div>
            <div class="stat-value" style="font-size:18px;" th:text="${task.statusText}">待配送</div>
        </div>
    </div>

    <div class="card">
        <h2>配送明细</h2>
        <table>
            <thead>
            <tr>
                <th>菜名</th>
                <th class="num">分量</th>
                <th>单位</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${task.items}">
                <td th:text="${item.recipeName}">菜名</td>
                <td class="num" th:text="${item.quantity}">1</td>
                <td th:text="${item.unit}">份</td>
            </tr>
            </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(task.items)}">该配送单没有明细。</div>
        <p class="hint">
            签收人、备注与送达时间在提交状态时一起登记；
            已送达或已异常的配送单不能再改状态。
        </p>
    </div>

    <div class="card">
        <h2>更新配送状态</h2>
        <form method="post" th:action="@{'/operation/deliveries/' + ${task.taskId} + '/status'}"
              class="filter-form">
            <label for="status">状态</label>
            <select id="status" name="status">
                <option th:each="s : ${allStatus}" th:value="${s.name()}" th:text="${s.text}"
                        th:selected="${task.status == s.name()}">待配送</option>
            </select>
            <label for="receiver">签收人</label>
            <input type="text" id="receiver" name="receiver" th:value="${task.receiver}" placeholder="签收人"/>
            <label for="remark">备注</label>
            <input type="text" id="remark" name="remark" th:value="${task.remark}" placeholder="异常说明等"/>
            <button type="submit" class="btn btn-primary">提交</button>
        </form>
    </div>
</div>
<script th:src="@{/js/operation.js}"></script>
</body>
</html>
