<!DOCTYPE html>
<!--
    历史汇总快照页（M3 运营与履约）—— 每日聚合后的存档记录，用于历史追溯。
    布局沿用菜品页：公共导航栏 + .container + .page-header + 卡片，样式只引用 /css/style.css。
-->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('历史汇总快照')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('blanket')}"></nav>

<div class="container">
    <div class="page-header">
        <div>
            <h1>历史汇总快照</h1>
            <p class="muted" style="margin:4px 0 0;">
                系统每日聚合后的存档记录，用于历史追溯。
            </p>
        </div>
        <div class="page-actions">
            <a class="btn" th:href="@{/operation/blanket-orders}">返回备料页</a>
        </div>
    </div>

    <!-- 查询条件：汇总日期区间 -->
    <div class="card">
        <form class="filter-form" method="get" th:action="@{/operation/blanket-orders/history}">
            <label for="dateFrom">起始日期</label>
            <input type="date" id="dateFrom" name="dateFrom" th:value="${dateFrom}"/>
            <label for="dateTo">结束日期</label>
            <input type="date" id="dateTo" name="dateTo" th:value="${dateTo}"/>
            <button type="submit" class="btn btn-primary">查询</button>
            <a class="link" th:href="@{/operation/blanket-orders/history}">重置</a>
        </form>
    </div>

    <div class="card">
        <p class="summary">共 <strong th:text="${page.total}">0</strong> 份历史快照</p>

        <div class="empty" th:if="${page.list.isEmpty()}">
            该时间段内没有任何历史聚合快照。只有在订餐截止后触发过聚合的日期，才会产生快照。
        </div>

        <table th:if="${!page.list.isEmpty()}">
            <thead>
            <tr>
                <th>汇总日期</th>
                <th class="num">有效订单数</th>
                <th class="num">总金额（元）</th>
                <th style="width:100px;">快照状态</th>
                <th style="width:180px;" class="nowrap">生成时间</th>
                <th style="width:100px;">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="stat : ${page.list}">
                <td><strong th:text="${stat.statisticsDate}">2026-01-01</strong></td>
                <td class="num" th:text="${stat.totalOrders}">0</td>
                <td class="num"
                    th:text="${stat.totalAmount != null ? #numbers.formatDecimal(stat.totalAmount, 1, 2) : '0.00'}">0.00</td>
                <td>
                    <span class="badge badge-published"
                          th:text="${stat.status == 'AGGREGATED' ? '已聚合' : stat.status}">已聚合</span>
                </td>
                <td class="nowrap" th:text="${stat.generatedTime != null ? #dates.format(new java.util.Date(stat.generatedTime), 'yyyy-MM-dd HH:mm') : '—'}">2026-01-01 09:00</td>
                <td>
                    <a class="btn btn-sm" th:href="@{/operation/blanket-orders(date=${stat.statisticsDate})}">查看详情</a>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="hint">
            历史快照只读：每日截止后的聚合结果按日期存档，点击“查看详情”回到当天的备料页；
            重新聚合只会刷新当日快照，不会改动历史日期。
        </p>
    </div>
</div>
</body>
</html>
