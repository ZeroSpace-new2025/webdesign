<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>历史汇总快照</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/operation.css}">
</head>
<body>
<!-- 引入公共导航栏 -->
<nav th:replace="~{fragments/layout :: navbar('blanket')}"></nav>

<div class="container" style="margin-top: 20px;">
    <div class="page-header" style="margin-bottom: 20px;">
        <h1>历史汇总快照</h1>
        <p class="muted">系统每日聚合后的存档记录，用于历史追溯。</p>
    </div>

    <!-- 顶部查询工具栏 -->
    <div class="m3-toolbar">
        <form method="get" th:action="@{/operation/blanket-orders/history}" style="display: flex; gap: 10px; align-items: center;">
            <label style="font-size: 14px;">起始日期：<input type="date" name="dateFrom" th:value="${dateFrom}"></label>
            <label style="font-size: 14px;">结束日期：<input type="date" name="dateTo" th:value="${dateTo}"></label>
            <button type="submit" class="m3-btn m3-btn-primary">查询</button>
            <a th:href="@{/operation/blanket-orders}" class="m3-btn m3-btn-outline">返回备料页</a>
        </form>
    </div>

    <!-- 空状态提示 -->
    <div th:if="${page.list.isEmpty()}" class="m3-empty" style="margin-top: 20px;">
        <div class="m3-empty-icon">📅</div>
        <p>该时间段内没有任何历史聚合快照。</p>
        <p style="font-size: 13px; color: #999;">只有在订餐截止后触发过聚合的日期，才会产生快照。</p>
    </div>

    <!-- 数据表格 -->
    <table th:if="${!page.list.isEmpty()}" class="m3-table" style="margin-top: 20px;">
        <thead>
        <tr>
            <th>汇总日期</th>
            <th>有效订单数</th>
            <th>总金额(元)</th>
            <th>快照状态</th>
            <th>生成时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="stat : ${page.list}">
            <td><strong th:text="${stat.statisticsDate}"></strong></td>
            <td th:text="${stat.totalOrders}"></td>
            <td>￥<span th:text="${#numbers.formatDecimal(stat.totalAmount, 1, 2)}"></span></td>
            <td>
                <span class="badge badge-published" th:text="${stat.status}">AGGREGATED</span>
            </td>
            <!-- 处理时间戳展示 -->
            <td th:text="${stat.generatedTime != null ? #dates.format(new java.util.Date(stat.generatedTime), 'yyyy-MM-dd HH:mm:ss') : '-'}"></td>
            <td>
                <!-- 点击可以查看那一天的详情（这里链接到当天的备料页） -->
                <a th:href="@{/operation/blanket-orders(date=${stat.statisticsDate})}" class="m3-btn m3-btn-outline" style="padding: 4px 10px; font-size: 13px;">查看详情</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 分页控件（简单版） -->
    <div class="m3-pagination" th:if="${page.total > 0}">
        <span>共 <strong th:text="${page.total}"></strong> 条记录</span>
    </div>
</div>

</body>
</html>
