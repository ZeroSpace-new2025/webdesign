<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>后厨总括订单（生产单）</title>
    <style>
        body { font-family: "SimSun", "宋体", sans-serif; padding: 20px; background: #f9f9f9; }
        .paper { max-width: 850px; margin: 0 auto; background: #fff; padding: 40px; border: 1px solid #ccc; }
        .title { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
        .meta { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #000; padding: 10px; text-align: center; font-size: 15px; }
        th { background: #f2f2f2; }
        .print-btn { text-align: center; margin-bottom: 20px; }
        .print-btn button { padding: 8px 20px; font-size: 16px; cursor: pointer; margin: 0 10px;}
        @media print {
            body { background: #fff; padding: 0; }
            .paper { border: none; padding: 0; }
            .print-btn { display: none; }
        }
    </style>
</head>
<body>

<div class="print-btn">
    <button onclick="window.print()">🖨️ 打印总括订单</button>
    <button onclick="window.close()">关闭</button>
</div>

<div class="paper">
    <div class="title">企业餐厅后厨总括订单</div>

    <div class="meta">
        <span>就餐日期：<span th:text="${date}"></span></span>
        <span>生成时间：<span th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></span></span>
    </div>

    <table>
        <thead>
        <tr>
            <th width="15%">分类</th>
            <th width="30%">菜名（食品）</th>
            <th width="10%">单位</th>
            <th width="15%">数量（分量）</th>
            <th width="15%">单价</th>
            <th width="15%">合计</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.category}">热菜</td>
            <td th:text="${item.recipeName}">黑椒牛柳</td>
            <td th:text="${item.unit}">份</td>
            <td><strong th:text="${item.totalQuantity}">2</strong></td>

            <!-- 👇 动了个小聪明：用 总金额 / 数量 算出单价显示出来 -->
            <td>
                ￥<span th:text="${item.totalQuantity > 0 and item.totalAmount != null ? #numbers.formatDecimal(item.totalAmount / item.totalQuantity, 1, 2) : '0.00'}"></span>
            </td>
            <td>￥<span th:text="${item.totalAmount != null ? #numbers.formatDecimal(item.totalAmount, 1, 2) : '0.00'}"></span></td>
        </tr>
        <tr th:if="${items == null || items.isEmpty()}">
            <td colspan="6" style="color: #999; padding: 20px;">今日无有效需求</td>
        </tr>

        <!-- 总计金额行 -->
        <tr>
            <td colspan="5" style="text-align: right; font-weight: bold; background: #fafafa;">总计金额：</td>
            <td style="font-weight: bold; background: #fafafa;">￥<span th:text="${totalAmount != null ? #numbers.formatDecimal(totalAmount, 1, 2) : '0.00'}"></span></td>
        </tr>

        <!-- 补齐空格 -->
        <tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>
        </tbody>
    </table>

    <div style="margin-top: 40px; display: flex; justify-content: space-between;">
        <span>厨房主管签字：______________</span>
        <span>制单时间：<span th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"></span></span>
    </div>
</div>

</body>
</html>
