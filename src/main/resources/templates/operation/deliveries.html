<!DOCTYPE html>
<!--
    配送管理页（M3 运营与履约）—— 按日期/状态/工位查询配送任务，批量打印。
    布局沿用菜品页：公共导航栏 + .container + .page-header + 卡片，样式只引用 /css/style.css。
-->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('配送管理')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('delivery')}"></nav>

<div class="container">
    <div class="page-header">
        <div>
            <h1>配送管理</h1>
            <p class="muted" style="margin:4px 0 0;">
                到达配餐开始时间后可生成配送任务，按工位批量打印配送单。
            </p>
        </div>
        <div class="page-actions">
            <form class="inline-form" method="post" th:action="@{/operation/deliveries/generate}">
                <input type="hidden" name="date" th:value="${date}"/>
                <button type="submit" class="btn btn-primary">生成配送任务</button>
            </form>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- 查询条件：日期 + 状态 + 工位 -->
    <div class="card">
        <form class="filter-form" method="get" th:action="@{/operation/deliveries}">
            <label for="date">配送日期</label>
            <input type="date" id="date" name="date" th:value="${date}"/>
            <label for="status">状态</label>
            <select id="status" name="status">
                <option value="">全部</option>
                <option th:each="s : ${allStatus}" th:value="${s.name()}" th:text="${s.text}"
                        th:selected="${status == s.name()}">待配送</option>
            </select>
            <label for="workstation">工位</label>
            <input type="text" id="workstation" name="workstation" th:value="${workstation}"
                   placeholder="支持模糊匹配"/>
            <button type="submit" class="btn btn-primary">查询</button>
            <a class="link" th:href="@{/operation/deliveries}">重置</a>
        </form>
    </div>

    <div class="card" th:if="${page.list.isEmpty()}">
        <div class="empty">
            当日暂无配送任务。配餐开始时间（默认 11:30）后点击“生成配送任务”，或等待定时任务自动生成。
        </div>
    </div>

    <form th:if="${!page.list.isEmpty()}" method="post" th:action="@{/operation/deliveries/batch-print}"
          onsubmit="return m3ConfirmPrint(event)">
        <div class="card">
            <p class="summary">
                共 <strong th:text="${page.total}">0</strong> 条配送任务，勾选后可批量打印。
            </p>
            <table>
                <thead>
                <tr>
                    <th style="width:44px;">
                        <input type="checkbox" aria-label="全选" onclick="m3ToggleAll(this)"/>
                    </th>
                    <th>任务编号</th>
                    <th>员工</th>
                    <th>工位</th>
                    <th>电话</th>
                    <th style="width:90px;">状态</th>
                    <th style="width:80px;">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${page.list}">
                    <td><input type="checkbox" name="taskIds" th:value="${task.taskId}"/></td>
                    <td th:text="${task.taskNo}">DT-20260101-1</td>
                    <td>
                        <div th:text="${task.employeeName}">员工</div>
                        <div class="muted" th:if="${task.deptName != null}" th:text="${task.deptName}">部门</div>
                    </td>
                    <td th:text="${task.workstation}">R-12</td>
                    <td th:text="${task.phone}">13800000000</td>
                    <td>
                        <span class="badge"
                              th:classappend="${task.status == 'PENDING'} ? 'badge-draft'
                                  : (${task.status == 'DELIVERING'} ? 'badge-published'
                                  : (${task.status == 'DELIVERED'} ? 'badge-active' : 'badge-offline'))"
                              th:text="${task.statusText}">待配送</span>
                    </td>
                    <td>
                        <a class="btn btn-sm" th:href="@{'/operation/deliveries/' + ${task.taskId}}">详情</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">批量打印选中任务</button>
            </div>
            <p class="hint">
                配送单在打印时才登记打印次数与打印时间；状态只能按 待配送 → 配送中 → 已送达 流转，
                配送中可直接登记为配送异常。
            </p>
        </div>
    </form>
</div>
<script th:src="@{/js/operation.js}"></script>
</body>
</html>
