<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? '编辑菜品' : '新增菜品')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('recipe')}"></nav>

<div class="container">
    <div class="page-header">
        <h1 th:text="${isEdit} ? '编辑菜品' : '新增菜品'">新增菜品</h1>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="card">
        <form th:action="@{/recipes/save}" th:object="${form}" method="post"
              enctype="multipart/form-data">
            <input type="hidden" th:field="*{recipeId}"/>
            <!-- 乐观锁版本号：编辑时回传，与库中不一致会返回 40902 -->
            <input type="hidden" th:field="*{version}"/>
            <input type="hidden" th:field="*{imageUrl}"/>

            <div class="form-row">
                <div class="form-group">
                    <label>菜品名称 <span class="req">*</span></label>
                    <input type="text" class="form-control" th:field="*{name}"
                           placeholder="如：小炒肉" required/>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <div class="field-with-picker">
                        <select class="form-control" id="category-picker" aria-label="选择已有分类">
                            <option value="">选择已有分类…</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">分类</option>
                            <option value="__new__">＋ 新建分类</option>
                        </select>
                        <input type="text" class="form-control" id="category-input" name="category"
                               th:value="*{category}" list="category-options"
                               placeholder="如：热菜"/>
                    </div>
                    <datalist id="category-options">
                        <option th:each="c : ${categories}" th:value="${c}"></option>
                    </datalist>
                    <div class="muted">
                        优先从已有分类里选，避免出现“热菜 / 热 菜”这类重复分类；保存时会自动去空格。
                        分类是生产单按类统计的口径，请保持统一。
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>计量单位</label>
                    <input type="text" class="form-control" th:field="*{unit}"
                           placeholder="如：份、两、个"/>
                </div>
                <div class="form-group">
                    <label>单价（元）<span class="req">*</span></label>
                    <input type="number" class="form-control" th:field="*{unitPrice}"
                           step="0.01" min="0" required/>
                </div>
            </div>

            <div class="form-group">
                <label>菜品图片</label>
                <input type="file" class="form-control" name="imageFile" accept="image/*"/>
                <div class="muted" th:if="${form.imageUrl != null}">
                    当前图片：<a th:href="${form.imageUrl}" th:text="${form.imageUrl}" target="_blank"></a>
                </div>
            </div>

            <div class="form-group">
                <label>菜品描述</label>
                <textarea class="form-control" th:field="*{description}"
                          placeholder="菜品口味、特色等"></textarea>
            </div>

            <div class="form-group" th:if="${isEdit}">
                <label>状态</label>
                <select class="form-control" th:field="*{status}">
                    <option th:each="s : ${allStatus}" th:value="${s.name()}" th:text="${s.label}">可售</option>
                </select>
                <div class="muted">下架请回到列表页点“停用”，这里只用于把误停用的菜品重新置为可售。</div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存</button>
                <a class="btn" th:href="@{/recipes}">取消</a>
            </div>
        </form>
    </div>
</div>

<script>
    /*
     * 分类选择：下拉只负责“把已有分类填进输入框”，真正提交的仍是 name="category" 的文本框。
     * 这样既能点选已有分类，也能直接输入新分类，且不依赖 JS（脚本失效时文本框照常可用）。
     */
    (function () {
        var picker = document.getElementById('category-picker');
        var input = document.getElementById('category-input');
        if (!picker || !input) { return; }
        if (input.value) {
            var matched = Array.prototype.some.call(picker.options, function (option) {
                return option.value === input.value;
            });
            if (matched) { picker.value = input.value; }
        }
        picker.addEventListener('change', function () {
            if (picker.value === '__new__') {
                input.value = '';
                input.focus();
            } else if (picker.value) {
                input.value = picker.value;
            }
        });
    })();
</script>
</body>
</html>
