<!DOCTYPE html>
<!--
	订单模块公共片段（页头、导航、登录身份展示、提示消息）
	页面通过 th:replace 引用，例如：
	  <head th:replace="~{ordertransaction/fragments/common :: head('今日点餐')}"></head>
	身份不再由页面填写：登录态由用户与报表中心签发 JWT，认证拦截器解析后写入登录上下文。
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="'企业餐厅点餐系统 · ' + ${title}">企业餐厅点餐系统</title>
	<link rel="stylesheet" th:href="@{/css/ordertransaction.css}">
</head>
<body>

<!-- 顶部导航 -->
<header th:fragment="navbar(active)" class="topbar">
	<div class="topbar-inner">
		<span class="brand">企业餐厅点餐系统</span>
		<nav class="nav">
			<a th:href="@{/order/create}" th:classappend="${active == 'create'} ? 'active'">今日点餐</a>
			<a th:href="@{/order/mine}" th:classappend="${active == 'mine'} ? 'active'">我的订单</a>
		</nav>
		<span class="module-hint">订单与交易核心</span>
	</div>
</header>

<!-- 登录身份展示：只读，取值来自认证上下文（不再允许页面切换身份） -->
<section th:fragment="identity(userId, userName)" class="identity">
	<p class="hint" th:if="${userId == null}">
		当前请求没有登录身份，请先到登录页登录后再点餐。
	</p>
	<p class="hint" th:unless="${userId == null}">
		当前登录：<strong th:text="${userName} ?: ('员工#' + ${userId})">员工</strong>
		（ID <span th:text="${userId}">-</span>）
	</p>
</section>

<!-- 操作提示 -->
<div th:fragment="flash" class="flash">
	<p class="message success" th:if="${success}" th:text="${success}">操作成功</p>
	<p class="message error" th:if="${error}" th:text="${error}">操作失败</p>
</div>

</body>
</html>
