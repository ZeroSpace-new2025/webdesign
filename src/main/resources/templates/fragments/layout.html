<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' - 企业餐厅点餐系统'">企业餐厅点餐系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- 导航栏片段：active 参数用于高亮当前菜单 -->
<nav th:fragment="navbar(active)" class="navbar">
    <a class="brand" th:href="@{/}">🍽️ 企业餐厅点餐</a>
    <div class="nav-links">
        <a th:href="@{/order/create}" th:classappend="${active == 'order'} ? 'active'">今日点餐</a>
        <a th:href="@{/order/mine}" th:classappend="${active == 'mine'} ? 'active'">我的订单</a>
        <a th:href="@{/recipes}" th:classappend="${active == 'recipe'} ? 'active'">菜品管理</a>
        <a th:href="@{/menus}" th:classappend="${active == 'menu'} ? 'active'">菜单管理</a>
        <a th:href="@{/console}" th:classappend="${active == 'console'} ? 'active'">控制台</a>

        <!-- ====== M3 运营与履约模块入口 开始 ====== -->
        <a th:href="@{/operation/blanket-orders}" th:classappend="${active == 'blanket'} ? 'active'">厨房备料</a>
        <a th:href="@{/operation/deliveries}" th:classappend="${active == 'delivery'} ? 'active'">配送管理</a>
        <a th:href="@{/operation/configs/service-window}" th:classappend="${active == 'window'} ? 'active'">时间配置</a>
        <!-- ====== M3 运营与履约模块入口 结束 ====== -->

    </div>
</nav>

<!-- 时间戳片段：LocalDateTime 渲染成 yyyy-MM-dd HH:mm，空值显示占位符 -->
<th:block th:fragment="timestamp(value)">
    <span th:if="${value == null}">—</span>
    <span th:if="${value != null}"
          th:text="${#strings.substring(#strings.replace(value.toString(), 'T', ' '), 0, 16)}">2026-01-01 12:00</span>
</th:block>

</body>
</html>
